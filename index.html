<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generar folios de facturación</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="topbar"></header>
  <main>
    <div id="app">
      <section class="tarjeta">
        <h2><span class="paso">1</span> 🖼️ Sube la imagen de la tabla</h2>
        <p class="ayuda">Arrastra la imagen aquí, haz clic para elegirla o pégala con <b>Ctrl + V</b>. Se lee automáticamente.</p>
        <div class="dropzone" id="dropzone">
          <div class="grande">📥</div>
          <b>Suelta aquí la imagen</b>
          <div class="nota">(PNG o JPG, como la tabla de "CORPORATION …" con CLIENTE, CONCEPTO, CANTIDAD, P/U…)</div>
        </div>
        <input type="file" id="archivo" accept="image/*" class="oculto">
        <div class="vista-previa oculto" id="vistaPrevia">
          <img id="imgPrevia" alt="Imagen cargada">
          <div id="estadoOCR"></div>
          <div class="progreso oculto" id="barraOCR"><div></div></div>
        </div>
        <div class="acciones">
          <button class="btn sec" id="btnManual">✍️ Capturar sin imagen</button>
        </div>
      </section>

      <section class="tarjeta oculto" id="tarjetaGeneral">
        <h2><span class="paso">2</span> 🏢 Facturadora y fechas</h2>
        <div class="rejilla">
          <div class="ancho">
            <label>Empresa facturadora (emisora) <span class="nota" id="notaEmisor"></span></label>
            <div style="display:flex; gap:10px">
              <select id="selEmisor"></select>
              <button class="btn sec" id="btnNuevoEmisor" title="Agregar al backlog">➕</button>
            </div>
          </div>
          <div><label>Fecha de factura</label><input type="date" id="fechaFactura"></div>
          <div><label>Fecha de operación</label><input type="date" id="fechaOperacion"></div>
          <div><label>Moneda</label><input type="text" id="moneda"></div>
        </div>
      </section>

      <div id="facturas"></div>

      <div class="barra-final oculto" id="barraFinal">
        <div class="resumen" id="resumen"></div>
        <button class="btn sec" id="btnAgregarFactura">➕ Agregar factura</button>
        <button class="btn grande" id="btnZip" style="margin-left:auto">⬇️ Descargar todos (ZIP)</button>
      </div>
    </div>
  </main>

  <script src="vendor/supabase.js"></script>
  <script src="vendor/tesseract.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sat.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
